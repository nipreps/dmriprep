name: Build and deploy documentation

on:
  push:
    branches:
      - master
    tags:
      - '*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true
          environments: docs

      - name: Build documentation
        run: SPHINXOPTS="-W" pixi run -e docs build-docs

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Prepare gh-pages worktree
        if: github.repository == 'nipreps/dmriprep'
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add site gh-pages

      - name: Ensure .nojekyll
        if: github.repository == 'nipreps/dmriprep'
        run: |
          touch site/.nojekyll

      - name: Deploy master documentation
        if: github.repository == 'nipreps/dmriprep' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p site/master
          rsync -a --delete docs/_build/html/ site/master/

      - name: Deploy tagged documentation
        if: github.repository == 'nipreps/dmriprep' && github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          dest="site/${REF_NAME}"
          if [ -e "${dest}" ]; then
            echo "Documentation for ${REF_NAME} already exists"
            exit 1
          fi
          mkdir -p "${dest}"
          rsync -a docs/_build/html/ "${dest}/"

      - name: Update versions manifest
        if: github.repository == 'nipreps/dmriprep'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          site = pathlib.Path('site')
          site.mkdir(parents=True, exist_ok=True)

          tag_output = subprocess.run(
              ['git', 'tag', '--sort=-v:refname'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.split()
          tags = [tag for tag in tag_output if (site / tag).is_dir()]

          heads = []
          for candidate in ('master', 'main', 'latest', 'stable'):
              candidate_path = site / candidate
              if candidate_path.is_dir() and candidate not in heads:
                  heads.append(candidate)

          if os.environ.get('REF_TYPE') == 'branch':
              ref_name = os.environ.get('REF_NAME')
              if ref_name and (site / ref_name).is_dir() and ref_name not in heads:
                  heads.insert(0, ref_name)

          repository = os.environ.get('GITHUB_REPOSITORY', 'nipreps/dmriprep')
          try:
              owner, repo_name = repository.split('/', 1)
          except ValueError:
              owner, repo_name = 'nipreps', 'dmriprep'

          base_url = f"https://{owner}.github.io/{repo_name}/"

          def format_entry(identifier: str) -> dict:
              return {
                  'version': identifier,
                  'name': identifier,
                  'url': f"{base_url}{identifier}/",
              }

          head_entries = [format_entry(head) for head in heads]
          tag_entries = [format_entry(tag) for tag in tags]
          head_versions = {entry['version'] for entry in head_entries}

          manifest = {
              'heads': head_entries,
              'tags': tag_entries,
              'versions': head_entries + [entry for entry in tag_entries if entry['version'] not in head_versions],
              'downloads': [],
              'subprojects': [],
          }

          (site / 'versions.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Check for site changes
        if: github.repository == 'nipreps/dmriprep'
        id: site_changes
        run: |
          cd site
          if [ -n "$(git status --short)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: github.repository == 'nipreps/dmriprep' && steps.site_changes.outputs.changes == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: update for ${REF_NAME}"

      - name: Log summary
        if: github.repository == 'nipreps/dmriprep' && steps.site_changes.outputs.changes == 'true'
        run: |
          git -C site log -1 --stat

      - name: Push changes
        if: github.repository == 'nipreps/dmriprep' && steps.site_changes.outputs.changes == 'true'
        run: |
          git -C site push origin gh-pages
